# CI de cellid: compila Cell-ID, corre los tests (pytest), revisa el formato
# del código nuevo, mide la cobertura y construye el manual.
name: cellid

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Compilar y testear
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Descargar el código
        uses: actions/checkout@v7

      - name: Instalar dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y libtiff-dev zlib1g-dev clang-format

      - name: Instalar Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Instalar las dependencias de los tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install --group test

      - name: Compilar
        run: make

      - name: Tests (pytest)
        run: make test

      - name: Formato del código nuevo
        run: make format-check

  coverage:
    name: Cobertura del código C
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Descargar el código
        uses: actions/checkout@v7

      - name: Instalar dependencias del sistema
        run: sudo apt-get update && sudo apt-get install -y libtiff-dev zlib1g-dev

      - name: Instalar Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Instalar las dependencias de cobertura
        run: |
          python -m pip install --upgrade pip
          python -m pip install --group coverage

      - name: Medir la cobertura
        run: make coverage

      - name: Resumen en la página de la ejecución
        run: |
          {
            echo "## Cobertura de src/"
            echo
            echo "Informe completo, línea por línea: artefacto \`coverage-html\`."
            echo
            cat build-cov/coverage.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Guardar el informe
        uses: actions/upload-artifact@v7
        with:
          name: coverage-html
          path: build-cov/*.html

  sanitizers:
    name: Tests con sanitizers
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Descargar el código
        uses: actions/checkout@v7

      - name: Instalar dependencias del sistema
        run: sudo apt-get update && sudo apt-get install -y libtiff-dev zlib1g-dev

      - name: Instalar Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Instalar las dependencias de los tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install --group test

      - name: Tests con AddressSanitizer y UBSan
        run: make sanitize

  docs:
    name: Manual (Doxygen)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Descargar el código
        uses: actions/checkout@v7

      - name: Instalar Doxygen y Graphviz
        run: sudo apt-get update && sudo apt-get install -y doxygen graphviz

      - name: Construir el manual
        run: make docs

      - name: Guardar el manual
        uses: actions/upload-artifact@v7
        with:
          name: manual-html
          path: docs/build/html
